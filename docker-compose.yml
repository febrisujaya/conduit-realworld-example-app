services:
  db:
    image: postgres:16-alpine
    container_name: conduit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: conduit_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: conduit_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit_user -d conduit_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: febrisujaya/conduit-backend:latest
    container_name: conduit-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      JWT_KEY: ${JWT_KEY}
      DEV_DB_USERNAME: conduit_user
      DEV_DB_PASSWORD: ${DB_PASSWORD}
      DEV_DB_NAME: conduit_development
      DEV_DB_HOSTNAME: db
      DEV_DB_DIALECT: postgres
      DEV_DB_LOGGING: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    image: febrisujaya/conduit-frontend:latest
    container_name: conduit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
